<div class="shell intro"><h1>計算の型を、ひとつずつ。</h1><p>問題文の言葉を見つけて、式に数字を入れる。まずは6つから。</p></div>
<div class="shell layout">
<aside class="side" aria-label="計算の型を選ぶ"><div class="nav-title">はじめの6つ</div><nav class="nav-list" id="nav-basic"></nav><details id="nav-later"><summary>慣れたら、次の型へ</summary><nav class="nav-list" id="nav-extra"></nav></details><div class="nav-extra"><button class="nav-item" type="button" data-topic="practice">確認問題 8問</button><button class="nav-item" type="button" data-topic="teaching">教える方へ</button></div></aside>
<main class="lesson" id="lesson"><div class="mobile-nav"><label for="mobile-topic">今日は、どの型を練習する？</label><select id="mobile-topic"></select></div><div id="lesson-content"></div><div class="lesson-bottom" id="lesson-bottom"></div><p class="footnote">2026年9月9日作成。2026年6月～2027年5月のCBT試験の法令基準日は2026年4月1日。金額・条件・端数処理は、問題文と受検年度の教材を優先してください。<a href="https://www.kinzai.or.jp/ginou/fp/law.html" target="_blank" rel="noopener noreferrer">法令基準日を確認</a><br>計算例は練習用です。個別の契約や実際の納税額の判定に必要な条件は省略しています。</p><noscript><article class="nojs"><h2>まず覚える6つの型</h2><p>死亡保険金の非課税枠：500万円 × 法定相続人の数<br>相続税の基礎控除：3,000万円 ＋ 600万円 × 法定相続人の数<br>一時所得：受取額 − 正味払込保険料 − 50万円<br>入院給付金：日額 × 給付対象日数<br>必要保障額：必要なお金 − 用意できるお金<br>給与所得：給与収入 − 給与所得控除額</p><p>数字を変える練習には、JavaScriptを有効にして開いてください。</p></article></noscript></main>

'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('ja-JP',{maximumFractionDigits:4}).format(Math.abs(n)<1e-9?0:n);
const man=n=>fmt(n)+'万円', yen=n=>fmt(Math.round(n))+'円';
const source=(label,url)=>({label,url});
const nta=(name,section,code)=>source('国税庁｜'+name,'https://www.nta.go.jp/taxes/shiraberu/taxanswer/'+section+'/'+code+'.htm');
const S={
 exemption:nta('死亡保険金の非課税枠','sozoku','4114'),estate:source('国税庁｜財産を相続したとき','https://www.nta.go.jp/publication/pamph/koho/kurashi/html/05_5.htm'),
 temporary:nta('満期保険金等を受け取ったとき','shotoku','1755'),death:nta('死亡保険金の税金','shotoku','1750'),salary:nta('給与所得控除','shotoku','1410'),tax:nta('所得税の税率','shotoku','2260'),
 premium:nta('生命保険料控除','shotoku','1140'),premium2:source('国税庁｜保険と税・特例の対象年分','https://www.nta.go.jp/publication/pamph/koho/kurashi/html/04_2.htm'),retirement:nta('退職所得','shotoku','1420'),corp:nta('養老保険の保険料の取扱い','hojin','5363'),
 survivor:source('日本年金機構｜遺族基礎年金','https://www.nenkin.go.jp/service/jukyu/seido/izokunenkin/jukyu-yoken/20150401-04.html'),employee:source('日本年金機構｜遺族厚生年金','https://www.nenkin.go.jp/service/jukyu/seido/izokunenkin/jukyu-yoken/20150424.html'),
 old:source('日本年金機構｜老齢基礎年金','https://www.nenkin.go.jp/service/jukyu/seido/roureinenkin/jukyu-yoken/20150401-02.html'),early:source('日本年金機構｜繰上げ受給','https://www.nenkin.go.jp/service/jukyu/seido/roureinenkin/kuriage-kurisage/20140421-01.html'),late:source('日本年金機構｜繰下げ受給','https://www.nenkin.go.jp/service/jukyu/seido/roureinenkin/kuriage-kurisage/20140421-02.html'),
 high:source('厚生労働省｜高額療養費制度の概要','https://www.mhlw.go.jp/content/001729632.pdf'),medical:nta('医療費控除','shotoku','1120'),gift:nta('贈与税の計算と税率','zoyo','4408'),shares:nta('相続人と法定相続分','sozoku','4132'),inheritTax:nta('相続税の税率','sozoku','4155'),
 exam:source('きんざい｜2022年9月・3級実技（保険）公式問題','https://products.kinzai.or.jp/wp-content/uploads/2022/11/fp03_j_hoken_202209.pdf')
};
function field(key,label,value,unit='万円',min=0,max=null,integer=false,when=null){return{key,label,value,unit,min,max,integer,when}}
function mode(label,options,value){return{label,options,value}}

function result(label,value,steps,foot='',stop='この金額を聞かれたら、ここで止める'){return{label,value,steps,foot,stop}}
function warning(text){return{error:text}}
function table(headers,rows){return '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th scope="col">'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function premiumAmount(value,kind){const p=Math.round(value*10000);let d;if(kind==='old')d=p<=25000?p:p<=50000?p/2+12500:p<=100000?p/4+25000:50000;else if(kind==='special')d=p<=30000?p:p<=60000?p/2+15000:p<=120000?p/4+30000:60000;else d=p<=20000?p:p<=40000?p/2+10000:p<=80000?p/4+20000:40000;return Math.ceil(d)}
function incomeTax(y){const bands=[[1950000,.05,0],[3300000,.1,97500],[6950000,.2,427500],[9000000,.23,636000],[18000000,.33,1536000],[40000000,.4,2796000],[Infinity,.45,4796000]];const b=bands.find(b=>y<b[0]);return{tax:Math.max(0,y*b[1]-b[2]),rate:b[1],deduct:b[2]}}
function giftTax(m,kind){const normal=[[200,.1,0],[300,.15,10],[400,.2,25],[600,.3,65],[1000,.4,125],[1500,.45,175],[3000,.5,250],[Infinity,.55,400]],special=[[200,.1,0],[400,.15,10],[600,.2,30],[1000,.3,90],[1500,.4,190],[3000,.45,265],[4500,.5,415],[Infinity,.55,640]];const b=(kind==='special'?special:normal).find(b=>m<=b[0]);return{tax:Math.max(0,m*b[1]-b[2]),rate:b[1],deduct:b[2]}}
const topics=[
{id:'exemption',nav:'死亡保険金の非課税枠',category:'相続',title:'保険金の非課税枠は「500 × 人数」',desc:'まずは人数を数えるだけの型。',cue:'死亡保険金の<mark>非課税限度額</mark>は、いくらですか？',condition:'亡くなった人が保険料を全額負担し、相続人が保険金を受け取る基本ケース。',formula:'500万円 × 法定相続人の数',fields:[field('people','法定相続人の数',3,'人',1,99,true)],calc:v=>result('死亡保険金の非課税限度額',man(500*v.people),[row('妻と子2人なら、法定相続人は3人',`500万円 × ${fmt(v.people)}人 ＝ ${man(500*v.people)}`)],'受け取る保険金がこの枠以下なら、その保険金は全額非課税です。'),memory:'保険金は、1人500万円。',trap:'受取人1人ごと・保険会社1社ごとに、この枠を使うわけではありません。',more:'<p>受け取る保険金の合計からこの枠を引いた残りが、相続税の課税対象に入ります。相続人以外の受取人には、この非課税の適用はありません。</p><p>相続放棄者も「枠を計算する人数」には原則含めますが、放棄者本人が受け取る保険金に非課税は使えません。養子の人数には制限があります。死亡退職金の非課税枠は別枠です。</p>',sources:[S.exemption]},
{id:'inherit_base',nav:'相続税の基礎控除',category:'相続',title:'相続全体は「3,000 ＋ 600 × 人数」',desc:'保険金の非課税枠とは、別の計算。',cue:'相続税の<mark>基礎控除額</mark>は、いくらですか？',condition:'人数は法定相続人の数。相続をする財産全体の基礎控除を聞かれた問題。',formula:'3,000万円 ＋ 600万円 × 法定相続人の数',fields:[field('people','法定相続人の数',3,'人',1,99,true)],calc:v=>result('相続税の基礎控除額',man(3000+600*v.people),[row('先に、600万円に人数を掛ける',`600万円 × ${v.people}人 ＝ ${man(600*v.people)}`),row('最後に3,000万円を足す',`3,000万円 ＋ ${man(600*v.people)} ＝ ${man(3000+600*v.people)}`)]),memory:'相続全体は、3,000に600ずつ足す。',trap:'「死亡保険金の非課税限度額」と書かれていたら、500万円 × 人数です。',more:'<p>妻と子2人なら、保険金の非課税枠は1,500万円、相続全体の基礎控除は4,800万円。この2つを分けて覚えます。</p><p>相続放棄があっても、原則として放棄がなかったものとして人数を数えます。養子の人数制限は問題の条件を確認します。</p>',sources:[S.estate,S.exemption]},
{id:'temporary',nav:'一時所得と、その半分',category:'保険と税金',title:'「50万円を引く」で止める？ さらに半分？',desc:'聞かれ方を切り替えて、答えの違いを見てみよう。',mode:mode('問題で聞かれているのは？',[['income','一時所得の金額'],['taxable','総所得に入れる金額・課税対象額']],'income'),cue:v=>v.mode==='income'?'満期保険金に係る<mark>一時所得の金額</mark>は？':'一時所得のうち、<mark>総所得金額に算入する金額</mark>は？',condition:'自分が保険料を払い、自分が一括で受け取る。他の一時所得なし。金融類似商品の源泉分離課税に該当しない基本ケース。',formula:v=>v.mode==='income'?'受取額 − 正味払込保険料 − 50万円':'（受取額 − 正味払込保険料 − 50万円）÷ 2',fields:[field('received','受け取った保険金',700),field('paid','正味払込保険料の合計',500)],calc:v=>{const profit=v.received-v.paid,inc=Math.max(0,profit-50),steps=[row('払った保険料を引く',`${man(v.received)} − ${man(v.paid)} ＝ ${man(profit)}`),row('50万円を引く（マイナスなら0円）',`${man(profit)} − 50万円 → ${man(inc)}`)];if(v.mode==='taxable')steps.push(row('総所得に入れるときだけ、さらに半分',`${man(inc)} ÷ 2 ＝ ${man(inc/2)}`));return result(v.mode==='income'?'一時所得の金額':'総所得に入れる金額',man(v.mode==='income'?inc:inc/2),steps,v.mode==='income'?'「一時所得」を聞かれたので、半分にせずに止めます。':'これは税金そのものではなく、税金を計算する対象に入れる金額です。')},memory:'一時所得は50引く。総所得に入れるなら半分。',trap:'「一時所得はいつも半分」と覚えると、答える段階を間違えます。50万円の控除は、契約ごとに使えるわけでもありません。',more:'<p>先に、保険料を払った人・亡くなった人・受取人を確認します。</p>'+table(['保険金の例','税金の種類'],[['夫が払う／夫が死亡／妻が受取','相続税'],['妻が払う／夫が死亡／妻が受取','所得税'],['夫が払う／妻が死亡／子が受取','贈与税']])+'<p>自分で払った個人年金保険を毎年受け取る場合は、原則「雑所得」。年金額 − その年金に対応する必要経費で、50万円を引かず、半分にもしません。例：80万円 − 60万円 ＝ 20万円。</p><p>一時払養老保険等で保険期間等が5年以下のものや、一定の5年以内の解約は、源泉分離課税を確認します。</p>',sources:[S.temporary,S.death]},
{id:'benefits',nav:'入院・死亡の保険金',category:'保険の読み取り',title:'支払条件に合う保障だけ、計算する',desc:'入院は日数。死亡は、出る保障の足し算。',mode:mode('どの場面？',[['hospital','入院給付金'],['illness','病気で死亡'],['accident','事故で死亡']],'hospital'),cue:v=>v.mode==='hospital'?'<mark>入院給付金</mark>はいくらですか？':v.mode==='illness'?'<mark>病気で死亡</mark>した場合の保険金は？':'<mark>事故で死亡</mark>した場合の保険金は？',condition:v=>v.mode==='hospital'?'給付対象は「支払開始日」から退院日まで。支払限度日数以内の練習例。':'基本保障と定期特約は病気・事故の両方が対象。追加保障500万円は事故死亡だけ。すべて有効期間内の練習契約。',formula:v=>v.mode==='hospital'?'入院日額 × 給付対象日数':v.mode==='illness'?'基本保障 ＋ 定期特約':'基本保障 ＋ 定期特約 ＋ 事故死亡の追加保障',fields:[field('daily','入院日額',5000,'円',0,null,true,v=>v.mode==='hospital'),field('days','入院した日数',10,'日',1,365,true,v=>v.mode==='hospital'),field('start','何日目から支払われる？',1,'日目',1,365,true,v=>v.mode==='hospital'),field('base','基本保障',300,'万円',0,null,false,v=>v.mode!=='hospital'),field('term','定期特約',1000,'万円',0,null,false,v=>v.mode!=='hospital'),field('extra','事故死亡だけの追加保障',500,'万円',0,null,false,v=>v.mode==='accident')],calc:v=>{if(v.mode==='hospital'){const days=Math.max(0,v.days-v.start+1);return result('入院給付金',yen(v.daily*days),[row('支払いの対象になる日を数える',`${v.start}日目～${v.days}日目 → ${days}日間`),row('日額に、対象日数を掛ける',`${yen(v.daily)} × ${days}日 ＝ ${yen(v.daily*days)}`)])}const amount=v.base+v.term+(v.mode==='accident'?v.extra:0);return result('死亡保険金の合計',man(amount),[row('支払条件に合う保障を足す',`${man(v.base)} ＋ ${man(v.term)}${v.mode==='accident'?' ＋ '+man(v.extra):''} ＝ ${man(amount)}`)],v.mode==='illness'?'病気死亡なので、事故死亡だけの追加保障は足しません。':'事故死亡の追加保障も対象なので、足します。')},memory:'入院は「日額 × 対象日数」。死亡は「出るものを足す」。',trap:'10日入院でも「5日目から支払う」なら対象は6日間。入院した全日数を、そのまま掛けないこと。',more:'<p>手術給付金が「入院日額の20倍」と指定されたら、日額5,000円 × 20 ＝ 10万円。実際の支払条件は保険の資料で確認します。</p><p>特約名だけで出る・出ないを決めません。すでに受け取った特定疾病保険金と、その支払によって消滅した死亡保障を二重に足さないようにします。</p>',sources:[S.exam]},
{id:'coverage',nav:'必要保障額',category:'保険の見直し',title:'必要保障額は「足りないお金」',desc:'必要な支出を足して、用意できるお金を引く。',cue:'死亡した場合の<mark>必要保障額</mark>はいくらですか？',condition:'生活費の割合・期間は問題の指定。教育費などを加え、公的年金・貯蓄などを差し引く練習例。',formula:'今後の支出合計 − 用意できるお金の合計',fields:[field('monthly','現在の生活費（月額）',30,'万円／月'),field('ratio','死亡後の生活費の割合',70,'％',0,100),field('years','この生活費が続く期間',20,'年',0,100),field('other','教育費・葬儀費用などの合計',800),field('prepared','公的年金・貯蓄などの合計',4000)],calc:v=>{const life=v.monthly*v.ratio/100*12*v.years,total=life+v.other,lack=Math.max(0,total-v.prepared);return result('必要保障額',man(lack),[row('月額を年額にして、年数を掛ける',`${fmt(v.monthly)} × ${fmt(v.ratio/100)} × 12 × ${fmt(v.years)} ＝ ${man(life)}`),row('生活費以外の支出を足す',`${man(life)} ＋ ${man(v.other)} ＝ ${man(total)}`),row('用意できるお金を引く',`${man(total)} − ${man(v.prepared)} → ${man(lack)}`)],'用意できるお金が支出以上なら、不足は0円です。')},memory:'必要なお金から、用意できるお金を引く。',trap:'月額の生活費には「×12」が必要。70％は、この例で指定された割合です。毎回70％にするわけではありません。',more:'<p>子の独立前・独立後で割合や期間が変わる問題は、期間ごとに生活費を計算して足します。</p><p>団体信用生命保険で完済される住宅ローンは、死亡後の返済額に入れません。「加入済み保険は考慮しない」なら引かず、「追加で必要な保険」を聞かれたら、まだ計算に反映していない加入済み保障を引きます。</p>',sources:[S.exam]},
{id:'salary',nav:'給与所得',category:'所得税',title:'給与所得は「収入 − 控除」',desc:'年収を、そのまま給与所得と答えない。',cue:'所得税における<mark>給与所得の金額</mark>は？',condition:'給与所得控除額は、問題の表から求めるか、問題で指定された額を使います。所得金額調整控除などがない例。',formula:'給与収入 − 給与所得控除額',fields:[field('annual','給与収入（年収）',720),field('deduction','給与所得控除額',182)],calc:v=>result('給与所得の金額',man(Math.max(0,v.annual-v.deduction)),[row('給与収入から控除額を引く',`${man(v.annual)} − ${man(v.deduction)} → ${man(Math.max(0,v.annual-v.deduction))}`)]),memory:'収入から引いて、所得にする。',trap:'表が「給与所得控除後の金額」を示していたら、それが給与所得です。同じ控除をもう一度引かないこと。',more:'<p>例：給与収入720万円で、表の給与所得控除額が「収入×10％＋110万円」なら、720×0.1＋110＝182万円。その後、720−182＝538万円が給与所得です。</p><p>給与所得控除の表・基礎控除・扶養関係の所得要件は改正があります。受検年度の教材と設問の表を使います。</p>',sources:[S.salary]},
{id:'estate',nav:'課税遺産総額',category:'相続',title:'相続の計算は、引くものを順番に',desc:'保険金の非課税枠を引き、最後に基礎控除を引く。',cue:'相続税の<mark>課税遺産総額</mark>はいくらですか？',condition:'保険料は被相続人が全額負担し、保険金は相続人1人が全額受取。生前贈与の加算など、他の調整なし。入力する財産・保険金は控除前の金額。',formula:'財産 ＋ 保険金の課税対象部分 − 債務等 − 基礎控除',fields:[field('property','預金・不動産など（保険金を除く）',6000),field('insurance','死亡保険金',2000),field('people','法定相続人の数',3,'人',1,99,true),field('debts','債務・葬式費用',200)],calc:v=>{const taxIns=Math.max(0,v.insurance-500*v.people),net=v.property+taxIns-v.debts,base=3000+600*v.people,taxable=Math.max(0,net-base);return result('課税遺産総額',man(taxable),[row('保険金から非課税枠を引く',`${man(v.insurance)} − 500万円 × ${v.people}人 → ${man(taxIns)}`),row('他の財産を足し、債務などを引く',`${man(v.property)} ＋ ${man(taxIns)} − ${man(v.debts)} ＝ ${man(net)}`),row('相続全体の基礎控除を引く',`${man(net)} − ${man(base)} → ${man(taxable)}`)],'これは相続税そのものの額ではありません。')},memory:'保険金の枠を先に。相続全体の枠を最後に。',trap:'「課税価格の合計額」などに非課税枠・債務が反映済みなら、二度引きしません。',more:'<p>「相続税の総額」は、課税遺産総額を法定相続分で分け、各人の金額を速算表に入れて税額を合計します。</p>'+table(['配偶者と相続する人','配偶者の割合','他の相続人の合計'],[['子','1/2','1/2'],['父母など（子系なし）','2/3','1/3'],['兄弟姉妹（子系・直系尊属なし）','3/4','1/4']])+'<p>別の練習例：課税遺産総額1,500万円、妻と子2人なら、妻750万円・子各375万円。税率は各10％なので、75＋37.5＋37.5＝150万円が相続税の総額。実際の納付額は、その後の配分・税額軽減等で変わります。</p>',sources:[S.exemption,S.estate,S.shares,S.inheritTax]},
{id:'premium',nav:'生命保険料控除',category:'所得税',title:'保険料控除は「表に入れる」',desc:'新旧と控除の種類を決めてから、年間保険料を当てはめる。',cue:'所得税の<mark>生命保険料控除額</mark>はいくらですか？',mode:mode('使う表を選ぶ',[['new','新契約：通常の表'],['old','旧契約の表'],['special','新契約・一般：23歳未満の扶養親族の特例']],'new'),condition:v=>v.mode==='special'?'2026・2027年分、23歳未満の扶養親族がいる場合の「新一般生命保険料」だけの特例。介護医療・個人年金には使いません。':v.mode==='old'?'2011年12月31日以前の旧契約。この計算欄は、1区分分の所得税の控除額です。':'2012年1月1日以後の新契約。一般生命保険料の特例が適用されない場合、または介護医療・個人年金。この計算欄は1区分分。',formula:v=>{const p=v.paid;if(v.mode==='old')return p<=2.5?'控除額 ＝ 払った保険料の全額':p<=5?'保険料 ÷ 2 ＋ 1.25万円':p<=10?'保険料 ÷ 4 ＋ 2.5万円':'控除額 ＝ 上限5万円';if(v.mode==='special')return p<=3?'控除額 ＝ 払った保険料の全額':p<=6?'保険料 ÷ 2 ＋ 1.5万円':p<=12?'保険料 ÷ 4 ＋ 3万円':'控除額 ＝ 上限6万円';return p<=2?'控除額 ＝ 払った保険料の全額':p<=4?'保険料 ÷ 2 ＋ 1万円':p<=8?'保険料 ÷ 4 ＋ 2万円':'控除額 ＝ 上限4万円'},fields:[field('paid','年間の正味払込保険料',6)],calc:v=>result('この区分の生命保険料控除額',yen(premiumAmount(v.paid,v.mode)),[row('選んだ表の式に、年間保険料を入れる',`${man(v.paid)} → ${yen(premiumAmount(v.paid,v.mode))}`)],'所得から引ける金額です。戻ってくる税金そのものではありません。'),memory:'新旧・種類を分ける。年間保険料を表へ。',trap:'一般・介護医療・個人年金の保険料を、先に全部足して1つの表に入れません。',more:()=>'<p>同じ区分・同じ新旧の保険料をまとめて、各表に入れます。所得税用の表です。</p>'+table(['年間保険料','新契約・通常'],[['2万円以下','全額'],['2万円超～4万円以下','÷2 ＋ 1万円'],['4万円超～8万円以下','÷4 ＋ 2万円'],['8万円超','4万円']])+table(['年間保険料','旧契約'],[['2.5万円以下','全額'],['2.5万円超～5万円以下','÷2 ＋ 1.25万円'],['5万円超～10万円以下','÷4 ＋ 2.5万円'],['10万円超','5万円']])+table(['年間保険料','新一般・特例'],[['3万円以下','全額'],['3万円超～6万円以下','÷2 ＋ 1.5万円'],['6万円超～12万円以下','÷4 ＋ 3万円'],['12万円超','6万円']])+'<p>3区分合計の上限は特例でも12万円。同一区分の新旧併用は、それぞれ計算した控除額を足して上限（通常4万円、一般の特例6万円）を適用し、旧契約だけの控除額とも比較します。住民税は別の表。更新等による新旧区分は問題の指定を確認します。計算欄は1円未満を切り上げます。</p>',sources:[S.premium,S.premium2]},
{id:'retirement',nav:'退職所得',category:'退職金',title:'勤続年数で控除を出し、残りを半分',desc:'20年までと、20年を超える部分を分ける。',cue:'退職金に係る<mark>退職所得の金額</mark>は？',condition:'勤続5年超の通常の退職所得。障害が直接原因の退職、他の退職手当との控除調整などはない例。',formula:'（退職金 − 退職所得控除額）÷ 2',fields:[field('years','勤続期間：年',24,'年',0,70,true),field('months','勤続期間：端数の月',2,'カ月',0,11,true),field('pay','退職金',1950)],calc:v=>{const n=v.years+(v.months>0?1:0);if(n<=5)return warning('勤続5年以下には、半分にしないなどの例外があります。下の補足を確認してください。この計算欄は勤続5年超の通常の退職所得の練習用です。');const d=n<=20?Math.max(80,n*40):800+70*(n-20),a=Math.max(0,(v.pay-d)/2);return result('退職所得の金額',man(a),[row('1年未満の端数は切り上げる',`${v.years}年${v.months}カ月 → ${n}年`),row('退職所得控除を計算',n<=20?`40万円 × ${n}年 ＝ ${man(d)}`:`800万円 ＋ 70万円 × ${n-20}年 ＝ ${man(d)}`),row('控除後の残りを半分にする',`（${man(v.pay)} − ${man(d)}）÷ 2 → ${man(a)}`)])},memory:'20年まで40ずつ。超えた年は70ずつ。最後に半分。',trap:'勤続24年2カ月は「25年」。退職所得控除額を聞かれたら、控除を出したところで止めます。',more:table(['勤続年数','退職所得控除'],[['20年以下','40万円 × 年数（最低80万円）'],['20年超','800万円 ＋ 70万円 ×（年数 − 20）']])+'<p>役員等の勤続5年以下は1/2計算なし。一般の勤続5年以下も、控除後の300万円を超える部分には1/2計算を使いません。障害が直接原因の退職などには別の調整があります。</p><p>退職所得は、原則として他の総所得金額に足さず、分離して税額を計算します。</p>',sources:[S.retirement]},
{id:'totalincome',nav:'総所得・課税所得・所得税',category:'所得税',title:'聞かれた段階で、計算を止める',desc:'合計する → 控除を引く → 税率を掛ける。',mode:mode('何を求める問題？',[['total','総所得金額'],['taxable','課税総所得金額'],['tax','所得税額（税額控除前）']],'total'),cue:v=>v.mode==='total'?'<mark>総所得金額</mark>はいくらですか？':v.mode==='taxable'?'<mark>課税総所得金額</mark>はいくらですか？':'<mark>所得税額</mark>はいくらですか？',condition:'給与所得と一時所得だけがある例。一時所得欄には、50万円控除後・1/2計算前の金額を入れます。税額控除・復興特別所得税は考慮しません。',formula:v=>v.mode==='total'?'給与所得 ＋ 一時所得 ÷ 2':v.mode==='taxable'?'総所得金額 − 所得控除の合計':'課税総所得金額 × 税率 − 速算表の控除額',fields:[field('salary','給与所得（年収ではない）',538),field('temporary','一時所得（半分にする前）',150),field('deduction','所得控除の合計',180,'万円',0,null,false,v=>v.mode!=='total')],calc:v=>{const total=v.salary+v.temporary/2,taxableY=Math.floor(Math.max(0,total-v.deduction)*10000/1000+1e-8)*1000,steps=[row('一時所得を半分にして足す',`${man(v.salary)} ＋ ${man(v.temporary)} ÷ 2 ＝ ${man(total)}`)];if(v.mode==='total')return result('総所得金額',man(total),steps,'まだ、所得控除を引かずに止めます。');steps.push(row('所得控除を引く（1,000円未満切捨て）',`${man(total)} − ${man(v.deduction)} → ${man(taxableY/10000)}`));if(v.mode==='taxable')return result('課税総所得金額',man(taxableY/10000),steps,'まだ税率を掛けずに止めます。');const b=incomeTax(taxableY);steps.push(row('速算表の税率・控除額を使う',`${yen(taxableY)} × ${fmt(b.rate*100)}％ − ${yen(b.deduct)} ＝ ${yen(b.tax)}`));return result('所得税額（税額控除前）',yen(b.tax),steps)},memory:'総所得は足す。課税所得は引く。税額は掛ける。',trap:'「所得控除」は税率を掛ける前。「税額控除」は税額を出した後に引きます。',more:'<p>給与所得538万円、一時所得150万円なら、総所得金額は613万円。所得控除180万円なら課税総所得金額は433万円。税率20％・控除427,500円を使うと、所得税額は438,500円です。</p><p>ここでの所得控除額は問題指定の練習値。基礎控除・配偶者控除等の額を一律の数字で暗記しないようにします。</p>',sources:[S.tax,S.temporary,S.salary]},
{id:'corp',nav:'法人保険の経理処理',category:'会社の保険',title:'会社の保険は、受取人と帳簿を見る',desc:'「全部が経費」「全部が利益」と決めつけない。',mode:mode('どの取引？',[['asset','養老保険：満期も死亡も会社が受取'],['half','養老保険：満期は会社・死亡は従業員の遺族'],['surrender','会社が保険を解約して返戻金を受取']],'half'),cue:v=>v.mode==='surrender'?'解約による<mark>雑収入・解約益</mark>はいくらですか？':'支払った保険料の<mark>経理処理</mark>は？',condition:v=>v.mode==='half'?'従業員全員などを対象とする福利厚生目的の養老保険。特約なし。役員・特定の従業員だけの契約は除きます。':v.mode==='asset'?'満期保険金も死亡保険金も、会社が受け取る養老保険。特約なし。':'保険契約終了時の解約返戻金と、帳簿に残っている保険の資産額を比べる例。',formula:v=>v.mode==='half'?'資産にする額 ＝ 保険料 ÷ 2<br>福利厚生費 ＝ 保険料 ÷ 2':v.mode==='asset'?'保険料の全額を、資産に計上':'解約返戻金 − その時点の資産計上額',fields:[field('premium','支払った保険料',120,'万円',0,null,false,v=>v.mode!=='surrender'),field('received','解約返戻金',900,'万円',0,null,false,v=>v.mode==='surrender'),field('asset','帳簿の資産計上額',700,'万円',0,null,false,v=>v.mode==='surrender')],calc:v=>v.mode==='surrender'?result(v.received>=v.asset?'解約益（雑収入）':'解約損',man(Math.abs(v.received-v.asset)),[row('帳簿の資産を差し引く',`${man(v.received)} − ${man(v.asset)} ＝ ${man(v.received-v.asset)}`)],v.received<v.asset?'差額がマイナスなので損失です。':'受取額の全額が利益ではありません。'):v.mode==='asset'?result('資産に計上する額',man(v.premium),[row('保険料を全額、保険料積立金へ',`${man(v.premium)} → 全額を資産`)],'この支払時点では、保険料を損金に算入しません。'):result('資産と福利厚生費',`${man(v.premium/2)}ずつ`,[row('支払保険料を半分にする',`${man(v.premium)} ÷ 2 ＝ ${man(v.premium/2)}`)],'半分を保険料積立金、半分を福利厚生費として処理します。'),memory:'受取人を確認。解約は、受取額から帳簿を引く。',trap:'「法人保険なら半分」とは限りません。保険の種類・受取人・対象者をセットで見ます。',more:'<p>「資産」は帳簿に残す金額。「福利厚生費」は従業員の福利厚生のための費用です。</p><p>死亡時は遺族・満期時は会社でも、役員や特定の従業員だけを対象とする場合は半分が給与扱いになることがあります。定期保険は契約日や最高解約返戻率などにより別途判定します。</p><p>資産計上額は「これまで払った保険料の合計」と同じとは限りません。</p>',sources:[S.corp]},
{id:'survivor_basic',nav:'遺族基礎年金',category:'公的年金',title:'遺族基礎年金は「基本額 ＋ 子の加算」',desc:'「子のある配偶者」が受け取る型。',cue:'子のある配偶者が受け取る<mark>遺族基礎年金の年額</mark>は？',condition:'受給要件を満たす子のある配偶者の例。配偶者は1956年4月2日以後生まれ。2026年度の金額を使います。',formula:'847,300円 ＋ 対象となる子の加算額の合計',fields:[field('children','加算の対象になる子の数',2,'人',1,20,true)],calc:v=>{const first=Math.min(2,v.children)*243800,later=Math.max(0,v.children-2)*81300,amount=847300+first+later;const steps=[row('第1子・第2子は1人243,800円',`243,800円 × ${Math.min(2,v.children)}人 ＝ ${yen(first)}`)];if(v.children>2)steps.push(row('第3子以降は1人81,300円',`81,300円 × ${v.children-2}人 ＝ ${yen(later)}`));steps.push(row('基本額に加算を足す',`847,300円 ＋ ${yen(first+later)} ＝ ${yen(amount)}`));return result('遺族基礎年金の年額',yen(amount),steps,'月額ではなく、1年間にもらう金額です。')},memory:'基礎の基本額は1つ。子の加算を足す。',trap:'子の年齢を確認。原則、18歳到達年度の3月31日までが対象です。',more:'<p>一定の障害がある子は20歳未満まで。子だけが受け取る場合は別の計算です。</p><p>基本額・加算額は年度で変わります。配偶者の生年月日によって基本額が異なる場合もあります。設問で指定された数字を使います。</p><p>遺族基礎年金と遺族厚生年金の両方の合計を聞かれたら、それぞれ計算して足します。</p>',sources:[S.survivor]},
{id:'survivor_emp',nav:'遺族厚生年金',category:'公的年金',title:'遺族厚生年金は「報酬比例部分 × 3/4」',desc:'すでに報酬比例部分が与えられているかを確認。',mode:mode('問題で与えられている数字は？',[['proportional','老齢厚生年金の報酬比例部分'],['average','平均標準報酬額と加入月数']],'proportional'),cue:'遺族が受け取る<mark>遺族厚生年金の年額</mark>は？',condition:v=>v.mode==='average'?'厚生年金に加入中の死亡という短期要件の例。全期間が2003年4月以降で乗率5.481/1,000。300月の最低保障を使い、他の加算・調整なし。':'受給要件を満たし、加算や65歳以上の配偶者の調整などがない基本例。',formula:v=>v.mode==='average'?'平均標準報酬額 × 5.481/1,000 × 計算に使う月数 × 3/4':'亡くなった人の老齢厚生年金の報酬比例部分 × 3/4',fields:[field('proportional','老齢厚生年金の報酬比例部分',80,'万円／年',0,null,false,v=>v.mode==='proportional'),field('average','平均標準報酬額',40,'万円',0,null,false,v=>v.mode==='average'),field('months','厚生年金の加入月数',240,'月',1,600,true,v=>v.mode==='average')],calc:v=>{if(v.mode==='proportional')return result('遺族厚生年金の年額',man(v.proportional*.75),[row('4分の3にする',`${man(v.proportional)} × 3 ÷ 4 ＝ ${man(v.proportional*.75)}`)]);const months=Math.max(300,v.months),amount=v.average*10000*.005481*months*.75;return result('遺族厚生年金の年額',yen(amount),[row('この短期要件では、300月未満は300月として計算',`${v.months}月 → ${months}月を使う`),row('報酬・乗率・月数を掛け、最後に3/4',`${yen(v.average*10000)} × 5.481 ÷ 1,000 × ${months} × 3 ÷ 4 ＝ ${yen(amount)}`)])},memory:'遺族厚生は、報酬比例部分の4分の3。',trap:'300月の最低保障は、すべての遺族厚生年金に使えるわけではありません。',more:'<p>2003年3月以前の加入期間は別の乗率で計算します。長期要件では上の300月の最低保障を使いません。</p><p>受け取る配偶者が65歳以上の場合などは調整があります。問題で「遺族年金の合計」を聞かれたら、受け取れる遺族基礎年金と遺族厚生年金を足します。</p>',sources:[S.employee]},
{id:'old_basic',nav:'老齢基礎年金',category:'公的年金',title:'老齢基礎年金は「満額 × 月数 ÷ 480」',desc:'40年 × 12カ月 ＝ 480カ月。',cue:'保険料の納付月数から、<mark>老齢基礎年金の年額</mark>を求めると？',condition:'受給要件を満たすものとして年額だけを計算。全額免除は2009年4月以降、追納なし。その他の免除・加算なし。',formula:'満額 ×（納付済月数 ＋ 全額免除月数 × 1/2）÷ 480',fields:[field('full','問題で指定された満額（年額）',847300,'円',0,null,true),field('paid','納付済月数',360,'月',0,480,true),field('exempt','全額免除月数（2009年4月以降）',0,'月',0,480,true)],calc:v=>{if(v.paid+v.exempt>480)return warning('この基本例では、納付済月数と全額免除月数の合計を480月以内にしてください。');const months=v.paid+v.exempt*.5,amount=v.full*months/480;return result('老齢基礎年金の年額',yen(amount),[row('全額免除の月は半分にして加える',`${v.paid} ＋ ${v.exempt} × 1/2 ＝ ${fmt(months)}月`),row('満額に、480月に対する割合を掛ける',`${yen(v.full)} × ${fmt(months)} ÷ 480 ＝ ${yen(amount)}`)],'表示は1円未満四捨五入。満額847,300円は2026年度・所定の生年月日の例です。')},memory:'老齢基礎は480で割る。全額免除の月は半分。',trap:'学生納付特例・納付猶予は、追納しないと年金額の計算に反映されません。',more:'<p>2009年3月以前の全額免除は1/3。一部免除には別の係数があるため、「免除なら全部半分」にはしません。</p><p>満額は年度・生年月日で異なります。20～60歳の第2号・第3号被保険者の期間も、保険料納付済期間に含まれます。</p>',sources:[S.old]},
{id:'extra_pension',nav:'付加年金・繰上げ・繰下げ',category:'公的年金',title:'付加年金は掛け算。受取時期は増減率。',desc:'年数を、そのまま掛けずに「月数」を確認。',mode:mode('どの計算？',[['extra','付加年金の年額'],['early','繰上げ受給'],['late','繰下げ受給']],'extra'),cue:v=>v.mode==='extra'?'<mark>付加年金の年額</mark>はいくらですか？':v.mode==='early'?'老齢年金を<mark>繰上げ受給</mark>するといくらですか？':'老齢年金を<mark>繰下げ受給</mark>するといくらですか？',condition:v=>v.mode==='extra'?'付加保険料を納め、65歳から受給する例。':v.mode==='early'?'1962年4月2日以後生まれで、1月につき0.4％減額を適用。加給年金等を含めない基本例。':'75歳まで繰下げられる人で、1月につき0.7％増額を適用。加給年金等を含めない基本例。',formula:v=>v.mode==='extra'?'200円 × 付加保険料を納めた月数':v.mode==='early'?'本来の年額 ×（1 − 0.004 × 前倒し月数）':'本来の年額 ×（1 ＋ 0.007 × 後ろ倒し月数）',fields:[field('months','付加保険料を納めた月数',120,'月',0,600,true,v=>v.mode==='extra'),field('annual','本来の年金額（年額）',100,'万円',0,null,false,v=>v.mode!=='extra'),field('offset','前倒し・後ろ倒しする月数',36,'月',1,120,true,v=>v.mode!=='extra')],calc:v=>{if(v.mode==='extra')return result('付加年金の年額',yen(v.months*200),[row('受け取る付加年金は、200円に月数を掛ける',`200円 × ${v.months}月 ＝ ${yen(v.months*200)}`)],'支払う付加保険料は月400円。受け取る年金を計算するときは200円です。');if(v.mode==='early'&&v.offset>60)return warning('繰上げの基本例では、65歳から前倒しできる月数は60月までです。');if(v.mode==='late'&&v.offset<12)return warning('繰下げ受給は原則66歳から。この例では、後ろ倒し月数を12月以上にしてください。');const rate=v.offset*(v.mode==='early'?.004:.007),value=v.annual*(1+(v.mode==='early'?-rate:rate));return result(v.mode==='early'?'繰上げ後の年額':'繰下げ後の年額',man(value),[row('まず増減率を求める',`${v.mode==='early'?'0.4':'0.7'}％ × ${v.offset}月 ＝ ${fmt(rate*100)}％`),row('本来の年額に増減率を反映',`${man(v.annual)} ×（1 ${v.mode==='early'?'−':'＋'} ${fmt(rate)}）＝ ${man(value)}`)])},memory:'付加は200。繰上げは0.4減、繰下げは0.7増。',trap:'繰上げ0.4％は所定の生年月日以後。それ以前生まれは0.5％です。',more:'<p>繰上げによる減額は生涯続きます。繰下げは生年月日等で上限年齢が異なり、加給年金などは増額対象に含めません。</p><p>「減額率」を聞かれたら率まで、「受給額」を聞かれたら年金額に率を反映したところまで計算します。</p>',sources:[S.old,S.early,S.late]},
{id:'high_med',nav:'高額療養費',category:'健康保険',title:'自己負担の上限と、払い戻しは別の答え',desc:'式に入れる医療費は、3割ではなく「10割」。',mode:mode('聞かれた金額は？',[['cap','自己負担限度額'],['benefit','高額療養費の支給額']],'cap'),cue:v=>v.mode==='cap'?'この月の<mark>自己負担限度額</mark>は？':'この月の<mark>高額療養費の支給額</mark>は？',condition:'問題で「80,100円＋（総医療費−267,000円）×1％」の式を指定。窓口負担3割、多数回該当なし、同じ暦月の保険診療。総医療費26.7万円以上の練習例。',formula:v=>v.mode==='cap'?'80,100円 ＋（総医療費 − 267,000円）× 1％':'窓口で払った3割分 − 自己負担限度額',fields:[field('medical','保険診療の総医療費（10割）',90,'万円',26.7)],calc:v=>{const total=Math.round(v.medical*10000),cap=80100+(total-267000)*.01,copay=total*.3,benefit=Math.max(0,copay-cap),steps=[row('10割の総医療費を式に入れる',`80,100 ＋（${fmt(total)} − 267,000）× 0.01 ＝ ${yen(cap)}`)];if(v.mode==='cap')return result('自己負担限度額',yen(cap),steps,'限度額を聞かれたので、ここで止めます。');steps.push(row('窓口負担の3割を計算',`${yen(total)} × 0.3 ＝ ${yen(copay)}`),row('窓口負担から限度額を引く',`${yen(copay)} − ${yen(cap)} ＝ ${yen(benefit)}`));return result('高額療養費の支給額',yen(benefit),steps)},memory:'上限を出して止める？ 払った3割から引く？',trap:'80,100円の式は、全員・全時期に共通ではありません。年齢・所得区分・受診時期を確認して、指定の式を使います。',more:'<p>差額ベッド代や入院時の食事代などは、高額療養費の対象外です。計算は月の初めから月末までの「暦月」ごと。</p><p>この教材は式の使い分けの練習です。現在の制度を使った個人の給付額シミュレーションではありません。</p>',sources:[S.high]},
{id:'medical_deduction',nav:'医療費控除',category:'所得税',title:'医療費控除は「医療費 − 補てん − 基準額」',desc:'最後に引くのは、必ず10万円とは限らない。',cue:'所得税の<mark>医療費控除額</mark>はいくらですか？',condition:'支払済みの対象医療費と、その医療費に対応する給付金だけがある例。通常の医療費控除を計算。',formula:'支払った対象医療費 − 補てんされる金額 − 基準額<span class="sub">基準額 ＝ 10万円と「総所得金額等 × 5％」の小さい方</span>',fields:[field('medical','支払った対象医療費',30),field('benefits','この医療費に対する給付金',8),field('income','総所得金額等（年収ではない）',400)],calc:v=>{const base=Math.min(10,v.income*.05),net=Math.max(0,v.medical-v.benefits),ded=Math.min(200,Math.max(0,net-base));return result('医療費控除額',man(ded),[row('給付金で補てんされない金額を出す',`${man(v.medical)} − ${man(v.benefits)} → ${man(net)}`),row('最後に引く基準額を選ぶ',`10万円 と ${man(v.income*.05)} の小さい方 → ${man(base)}`),row('基準額を引く（最低0円・最高200万円）',`${man(net)} − ${man(base)} → ${man(ded)}`)],'控除額は、払い戻される税金そのものではありません。')},memory:'基準額は「10万円」と「所得の5％」を比べる。',trap:'給付金が対応する医療費を超えても、余りを他の医療費から引きません。',more:'<p>総所得金額等が160万円なら、基準額は160×5％＝8万円。総所得金額等が200万円以上なら基準額は10万円です。</p><p>「医療費控除」と「高額療養費」は別の制度。医療費控除では、受け取った高額療養費など、対応する補てん金額を差し引きます。</p>',sources:[S.medical]},
{id:'gift',nav:'贈与税（暦年課税）',category:'贈与税',title:'年の合計から、110万円を引く',desc:'引いた後の金額を、贈与税の速算表へ。',mode:mode('使う速算表は？',[['normal','一般税率'],['special','特例税率：年初18歳以上・父母や祖父母から']],'normal'),cue:'暦年課税による<mark>贈与税額</mark>はいくらですか？',condition:'暦年課税。非課税制度・配偶者控除など他の特例なし。特例税率は、その年の1月1日に18歳以上の人が直系尊属から受けた贈与の場合。',formula:'（その年にもらった財産の合計 − 110万円）× 税率 − 速算表の控除額',fields:[field('received','その年にもらった財産の合計',210)],calc:v=>{const amount=Math.floor(Math.max(0,v.received-110)*10+1e-8)/10,b=giftTax(amount,v.mode);return result('贈与税額',man(b.tax),[row('年の合計から110万円を引く',`${man(v.received)} − 110万円 → ${man(amount)}`),row('基礎控除後の金額を速算表に当てはめる',`${man(amount)} × ${fmt(b.rate*100)}％ − ${man(b.deduct)} ＝ ${man(b.tax)}`)],'この練習では、基礎控除後の金額の1,000円未満を切り捨てて計算します。')},memory:'もらった人ごと、1年で110万円。',trap:'親からと祖父母からでも、同じ年にもらった分は合計します。渡した人ごとに110万円を引きません。',more:'<p>「相続時精算課税」と書かれていたら、この暦年課税の式をそのまま使いません。</p><p>特例税率は一般税率と表が異なります。たとえば基礎控除後390万円なら、一般は390×20％−25＝53万円、特例は390×15％−10＝48.5万円です。</p>',sources:[S.gift]}
];
const questions=[
['法定相続人は4人。相続税の基礎控除額は？','3,000 ＋ 600 × 4 ＝ <strong>5,400万円</strong>。相続全体は3,000＋600。'],
['法定相続人は4人。死亡保険金の非課税限度額は？','500 × 4 ＝ <strong>2,000万円</strong>。保険金の枠は1人500万円。'],
['自分で払った保険を自分が一括受取。受取900万円、払込700万円。他の一時所得なし。一時所得の金額は？','900 − 700 − 50 ＝ <strong>150万円</strong>。半分にせずに止めます。'],
['問3の一時所得のうち、総所得金額に入れる金額は？','150 ÷ 2 ＝ <strong>75万円</strong>。総所得に入れるときは、さらに半分。'],
['必要な支出は6,200万円。用意できるお金は4,500万円。必要保障額は？','6,200 − 4,500 ＝ <strong>1,700万円</strong>。足りない分を出します。'],
['入院日額6,000円。12日間すべてが給付対象。入院給付金は？','6,000 × 12 ＝ <strong>72,000円</strong>。日額に対象日数を掛けます。'],
['給与収入760万円、給与所得控除186万円。給与所得は？','760 − 186 ＝ <strong>574万円</strong>。給与収入から控除を引きます。'],
['勤続30年、通常の退職金2,100万円。退職所得は？','控除は800 ＋ 70 × 10 ＝ 1,500万円。<br>（2,100 − 1,500）÷ 2 ＝ <strong>300万円</strong>。']
];
const initial=t=>Object.fromEntries([['mode',t.mode?t.mode.value:''],...t.fields.map(f=>[f.key,f.value])]);
const state=Object.fromEntries(topics.map(t=>[t.id,initial(t)]));
let current='exemption';
const activeFields=(t,v)=>t.fields.filter(f=>!f.when||f.when(v));
const content=(value,v)=>typeof value==='function'?value(v):value||'';
function sourcesHTML(s){return '<ul>'+s.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(x.label)}</a></li>`).join('')+'</ul>'}
function workHTML(r){if(r.error)return '<div class="error" role="alert">'+esc(r.error)+'</div>';return '<div class="calculation">'+r.steps.map((s,i)=>`<div class="work-row"><div class="work-label">${i+1}. ${esc(s.label)}</div><div class="work-math">${esc(s.math)}</div></div>`).join('')+'</div><div class="result"><div class="result-label">'+esc(r.label)+'</div><div class="result-value">'+esc(r.value)+'</div>'+(r.foot?'<p class="result-foot">'+esc(r.foot)+'</p>':'')+(r.stop?'<span class="stop">'+esc(r.stop)+'</span>':'')+'</div>'}
function validate(t,v){for(const f of activeFields(t,v)){const x=v[f.key];if(x===''||!Number.isFinite(Number(x)))return '「'+f.label+'」に数字を入れてください。';if(Number(x)<f.min)return '「'+f.label+'」は'+fmt(f.min)+f.unit+'以上にしてください。';if(f.max!==null&&Number(x)>f.max)return '「'+f.label+'」は'+fmt(f.max)+f.unit+'以下にしてください。';if(f.integer&&!Number.isInteger(Number(x)))return '「'+f.label+'」は整数で入れてください。';}return ''}
function numeric(v){return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,k==='mode'?x:Number(x)]))}
function updateLesson(){const t=topics.find(t=>t.id===current);if(!t)return;const v=numeric(state[current]),error=validate(t,state[current]);$('cue').innerHTML=content(t.cue,v);$('conditions').innerHTML='<strong>この型を使う条件</strong><br>'+content(t.condition,v);if(error){$('formula').innerHTML='数字を入れると、使う式が表示されます。';$('worked').innerHTML='<div class="error" role="alert">'+esc(error)+'</div>';return}$('formula').innerHTML=content(t.formula,v);$('worked').innerHTML=workHTML(t.calc(v));}
function renderFields(t){const v=state[t.id];$('fields').innerHTML=activeFields(t,v).map(f=>`<div class="field"><label for="input-${f.key}">${esc(f.label)}</label><div class="input-wrap"><input id="input-${f.key}" data-field="${f.key}" type="number" inputmode="${f.integer?'numeric':'decimal'}" value="${esc(v[f.key])}" min="${f.min}" ${f.max!==null?'max="'+f.max+'"':''} step="${f.integer?'1':'any'}" aria-label="${esc(f.label)}、単位は${esc(f.unit)}"><span class="unit">${esc(f.unit)}</span></div></div>`).join('');$('fields').querySelectorAll('input').forEach(input=>input.addEventListener('input',()=>{state[t.id][input.dataset.field]=input.value;updateLesson()}));}
function renderTopic(t){$('lesson-content').innerHTML=`<div class="lesson-top fade-in"><div class="eyebrow">${topics.indexOf(t)<6?'はじめの6つ':'次に覚える型'} / ${esc(t.category)}</div><h2>${t.title}</h2><p class="lesson-desc">${t.desc}</p></div><div class="lesson-body"><section class="section"><h3 class="section-title"><span class="step-no">1</span>問題文の、この言葉を見つける</h3>${t.mode?`<div class="mode-area"><label for="lesson-mode">${t.mode.label}</label><select class="mode-select" id="lesson-mode">${t.mode.options.map(([value,label])=>`<option value="${value}" ${state[t.id].mode===value?'selected':''}>${label}</option>`).join('')}</select></div>`:''}<p class="cue-box" id="cue"></p><p class="conditions" id="conditions"></p></section><section class="section"><h3 class="section-title"><span class="step-no">2</span>この式を使う</h3><div class="formula" id="formula"></div></section><section class="section"><div class="example-head"><h3 class="section-title"><span class="step-no">3</span>数字を入れてみる</h3><button class="text-button" id="reset-values" type="button">例の数字に戻す</button></div><div class="fields" id="fields"></div><div id="worked" aria-live="polite" aria-atomic="true"></div><div class="memory"><span>覚え方</span><span>${t.memory}</span></div><div class="trap"><strong>ここで間違えやすい</strong><p>${t.trap}</p></div><details class="more"><summary>条件・例外をもう少し確認する</summary><div class="more-content">${content(t.more,state[t.id])}</div></details><details class="source-block"><summary>この型の公式資料</summary>${sourcesHTML(t.sources)}</details></section></div>`;renderFields(t);updateLesson();if(t.mode)$('lesson-mode').addEventListener('change',e=>{state[t.id].mode=e.target.value;renderFields(t);updateLesson()});$('reset-values').addEventListener('click',()=>{const oldMode=state[t.id].mode;state[t.id]=initial(t);state[t.id].mode=oldMode;renderFields(t);updateLesson()});}
function renderPractice(){return questions.map(([q,a],i)=>`<article class="practice-card"><div class="question-num">問 ${i+1}</div><p>${q}</p><details><summary>答えと式を見る</summary><div class="practice-answer">${a}</div></details></article>`).join('')}
const teacherHTML='<div class="teaching"><p><strong>1回に2～3型。</strong>最初は式を見ながら解いて構いません。</p><ol><li>「何を聞かれている？」と、答える金額の名前を確認する。</li><li>問題文の合図を見つけ、「どの式？」を選んでもらう。</li><li>「使う数字は？」と、式に必要な数字だけを拾う。</li><li>計算して、円・万円・月額・年額を確認する。</li></ol><div class="trap"><strong>間違えたら、1つだけ確認する</strong><p>① 型選び　② 数字選び　③ 計算　④ 答える段階<br>どこで間違えたかを確認し、同じ型をもう1問。</p></div><p style="margin-top:22px">同じ型を数字だけ変えて3問。慣れたら翌日・数日後に式を見ずに1問。計算の型ができたら、制度や支払条件を選ぶ問題も練習します。</p><details class="more"><summary>受検年度と、この教材の範囲</summary><div class="more-content"><p>2026年6月～2027年5月のCBT試験の法令基準日は2026年4月1日です。税金の控除額、年金の年額、高額療養費の限度額などは、問題の対象年分・受検年度の教材で確認します。</p><p>出題形式は取得できた2022年9月のきんざい公式過去問で確認し、制度は国税庁・日本年金機構等の公式資料に照合しています。学習順は覚えやすさで選んでおり、直近の出題頻度の順位ではありません。</p><p>この教材の計算欄は、各ページに示した条件の基本例です。学習する型を明確にするため、他の所得・給付との調整や特殊な契約の条件などは含めていません。</p></div></details></div>';
function selectTopic(id,scroll=false){if(!topics.some(t=>t.id===id)&&!['practice','teaching'].includes(id))return;current=id;const t=topics.find(t=>t.id===id);document.querySelectorAll('[data-topic]').forEach(el=>{if(el.dataset.topic===id)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current')});$('mobile-topic').value=id;if(t&&topics.indexOf(t)>=6)$('nav-later').open=true;if(t)renderTopic(t);else $('lesson-content').innerHTML=`<div class="lesson-top"><div class="eyebrow">${id==='practice'?'確認問題':'教える方へ'}</div><h2>${id==='practice'?'答えの前に、式を言ってみる。':'同じ問い方で、ひとつずつ。'}</h2><p class="lesson-desc">${id==='practice'?'自分で解いてから、答えと式を開いて確認。各問は基本条件の練習例です。':'覚える量を絞り、同じ手順を繰り返す。'}</p></div><div class="lesson-body">${id==='practice'?renderPractice():teacherHTML}</div>`;renderBottom();if(scroll)window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});}
function renderBottom(){const ids=[...topics.map(t=>t.id),'practice','teaching'],i=ids.indexOf(current);$('lesson-bottom').innerHTML=`<button class="plain-button" type="button" id="previous-topic" ${i===0?'disabled':''}>前の型</button><button class="next-button" type="button" id="next-topic" ${i===ids.length-1?'disabled':''}>${i===topics.length-1?'確認問題へ':i===topics.length?'教える方へ':'次の型へ'} →</button>`;$('previous-topic').addEventListener('click',()=>selectTopic(ids[i-1],true));$('next-topic').addEventListener('click',()=>selectTopic(ids[i+1],true));}
function printAll(){const pages=topics.map((t,i)=>{const v=initial(t),defaults=activeFields(t,v).map(f=>esc(f.label)+'：'+fmt(v[f.key])+esc(f.unit)).join(' ／ ');return `<article class="print-page"><div class="eyebrow">FP3級実技・保険顧客資産相談業務 / ${esc(t.category)} / ${i+1}</div><h2>${t.title}</h2><p class="cue-box">${content(t.cue,v)}</p><p class="conditions">${content(t.condition,v)}</p><div class="formula">${content(t.formula,v)}</div><p class="print-notes">練習例：${defaults}</p>${workHTML(t.calc(v))}<p class="memory"><span>覚え方</span><span>${t.memory}</span></p><div class="trap"><strong>間違えやすいところ</strong><p>${t.trap}</p></div><div class="print-notes">${content(t.more,v)}</div><div class="source-block">${sourcesHTML(t.sources)}</div></article>`});pages.push('<article class="print-page"><h2>確認問題と答え</h2>'+questions.map(([q,a],i)=>`<div class="practice-card"><div class="question-num">問 ${i+1}</div><p>${q}</p><div class="practice-answer">${a}</div></div>`).join('')+'</article>');$('print-all').innerHTML=pages.join('');window.print();}
function init(){topics.forEach((t,i)=>{const button=document.createElement('button');button.type='button';button.className='nav-item';button.dataset.topic=t.id;button.innerHTML=`<span class="nav-num">${String(i+1).padStart(2,'0')}</span><span>${t.nav}</span>`;(i<6?$('nav-basic'):$('nav-extra')).appendChild(button)});document.querySelectorAll('[data-topic]').forEach(button=>button.addEventListener('click',()=>selectTopic(button.dataset.topic,true)));$('mobile-topic').innerHTML='<optgroup label="はじめの6つ">'+topics.slice(0,6).map(t=>`<option value="${t.id}">${t.nav}</option>`).join('')+'</optgroup><optgroup label="次に覚える型">'+topics.slice(6).map(t=>`<option value="${t.id}">${t.nav}</option>`).join('')+'</optgroup><optgroup label="練習と教え方"><option value="practice">確認問題 8問</option><option value="teaching">教える方へ</option></optgroup>';$('mobile-topic').addEventListener('change',e=>selectTopic(e.target.value));$('print-button').addEventListener('click',printAll);selectTopic(current);}
init();
</script>
</body>
</html>
